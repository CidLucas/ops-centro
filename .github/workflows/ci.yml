name: CI

# Gate de qualidade (modelado no CI do mcp_brain): lint (ruff), varredura de
# segredos (gitleaks) e testes determinísticos (unit — sem Grafana/Turso/Telegram
# reais). Roda em todo push e em PRs para main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancela runs antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instala deps de dev (inclui ruff)
        run: uv sync --frozen --extra dev

      # Falha o build em imports não usados, nomes indefinidos e ordem de imports.
      # Config em pyproject.toml [tool.ruff]. `--output-format=github` anota o PR.
      - name: ruff check
        run: uv run ruff check --output-format=github .

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo para varrer todos os commits, não só o HEAD.
          fetch-depth: 0

      # Imagem oficial do gitleaks — sem dependência de licença de action.
      # `--redact` evita imprimir o segredo no log; sai != 0 se achar algo.
      - name: gitleaks detect
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --verbose --no-banner

  audit:
    name: Audit de dependências (pip-audit)
    runs-on: ubuntu-latest
    # NÃO-BLOQUEANTE por ora: levanta o baseline de CVEs sem travar o merge.
    # Política: promover a bloqueante quando o backlog estiver tratado.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Exporta o lockfile resolvido para requirements.txt (só deps de runtime;
      # sem o pacote local) e audita contra a base de CVEs do PyPI.
      - name: Exporta requirements do lockfile
        run: uv export --frozen --no-dev --no-emit-project -o requirements.txt

      - name: pip-audit
        run: uvx pip-audit -r requirements.txt --progress-spinner=off

  test:
    name: Testes (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instala projeto + deps de dev
        run: uv sync --frozen --extra dev

      # Só unit: determinísticos, sem Grafana Cloud/Turso/Telegram reais.
      # --cov-fail-under=80: piso de cobertura do scaffold atual; suba conforme
      # o receiver ganhar lógica de enriquecimento/ações.
      - name: pytest
        run: uv run pytest -m unit --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Sobe cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
