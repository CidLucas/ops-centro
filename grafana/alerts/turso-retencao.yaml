# Alertas da retenção de logs no Turso — issues #9 e #12.
#
# As séries vêm do próprio job de limpeza (`ops_centro.turso.retention`, métricas
# `ops_centro_logs_*` do catálogo em ops_centro/metrics.py). Se a regra 3 (job parado)
# disparar, as regras 1 e 2 estão cegas e a investigação começa por ela.
#
# Teto: 9 GiB = 9663676416 bytes (free tier do Turso, docs/free-tier-baseline.md).
# Se a cota do plano mudar, mude em TURSO_LIMIT_BYTES aqui e em TURSO_DB_SIZE_LIMIT_BYTES.

apiVersion: 1
groups:
  - orgId: 1
    name: ops-centro-turso
    folder: Ops Centro
    interval: 5m
    rules:
      - uid: ops-centro-turso-db-70
        title: 'Turso: banco de logs acima de 70% do free tier'
        condition: B
        for: 30m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Banco de logs do Turso em {{ printf "%.0f" $values.A.Value }}% do teto
          description: |-
            O banco `ops-centro-logs` passou de 70% dos 9 GiB do free tier.
            Ações, na ordem: (1) conferir se o job de retenção rodou hoje (`ops_centro_log_retention_deleted_total`); (2) encurtar a janela por nível em TURSO_LOG_RETENTION_DAYS; (3) rodar `make retention-vacuum` uma vez para devolver ao disco o espaço já liberado.
          runbook_url: https://github.com/CidLucas/ops-centro/blob/main/docs/turso-retencao.md
        labels:
          severity: warning
          component: turso
          app_name: ops-centro
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: ${DS_PROM}
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 100 * max(ops_centro_logs_db_bytes) / 9663676416
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 70
      - uid: ops-centro-turso-db-90
        title: 'Turso: banco de logs acima de 90% do free tier'
        condition: B
        for: 15m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Banco de logs do Turso em {{ printf "%.0f" $values.A.Value }}% do teto
          description: |-
            Passar dos 9 GiB tira o banco do free tier (RNF01: custo alvo R$ 0–50).
            A janela de retenção vigente não está compensando o volume de escrita: encurte-a **e** revise o que os apps mandam para o Turso — INFO em volume é papel do Loki, não da retenção longa (docs/turso-logs.md → 'O que logar').
          runbook_url: https://github.com/CidLucas/ops-centro/blob/main/docs/turso-retencao.md
        labels:
          severity: critical
          component: turso
          app_name: ops-centro
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: ${DS_PROM}
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 100 * max(ops_centro_logs_db_bytes) / 9663676416
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
      - uid: ops-centro-retencao-parada
        title: 'Turso: job de retenção sem execução há 36h'
        condition: B
        for: 1h
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: O job de limpeza de logs não roda desde ontem
          description: |-
            Nenhuma amostra de `ops_centro_log_retention_duration_seconds` nas últimas 36h — o workflow `.github/workflows/retention.yml` (cron diário) falhou, foi desabilitado, ou o secret TURSO_DATABASE_URL sumiu.
            Sem ele o banco cresce sem limite e os alertas de tamanho ficam olhando para uma série congelada.
          runbook_url: https://github.com/CidLucas/ops-centro/blob/main/docs/turso-retencao.md
        labels:
          severity: warning
          component: turso
          app_name: ops-centro
        data:
          - refId: A
            relativeTimeRange:
              from: 129600
              to: 0
            datasourceUid: ${DS_PROM}
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(increase(ops_centro_log_retention_duration_seconds_count[36h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
